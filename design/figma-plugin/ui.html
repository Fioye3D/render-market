<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px Inter,Arial,sans-serif;margin:24px;color:#f5f3ee;background:#101112}h1{font-size:24px;line-height:1.25}p{color:#b2b7c1;line-height:1.6}button{background:#5053ca;color:white;border:0;border-radius:8px;padding:14px 18px;margin-top:18px;font-weight:600;cursor:pointer}input{max-width:100%}#status{white-space:pre-wrap;font-size:12px}label{display:block;margin:22px 0 12px}button:disabled{opacity:.5;cursor:wait}</style></head><body><h1>RenderMarket<br>Portfolio builder</h1><p>Creates editable frames, reusable components, colour variables, typography styles and prototype links in this Figma file. Existing content is preserved.</p><label for="payload">Choose <strong>rendermarket.figmadraft.json</strong> from this project’s design folder.</label><input id="payload" type="file" accept=".json"><br><button id="build" disabled>Build the design file</button><p id="status">Select the supplied design payload to begin. No network access is used.</p><script>let payload;const status=document.querySelector('#status'),build=document.querySelector('#build');document.querySelector('#payload').onchange=async e=>{try{payload=JSON.parse(await e.target.files[0].text());if(!payload.scenes||!payload.images)throw Error('Choose the RenderMarket design payload.');status.textContent=payload.scenes.length+' artboards ready. Build in a new file for the clearest result.';build.disabled=false}catch(err){status.textContent=err.message;build.disabled=true}};build.onclick=()=>{build.disabled=true;status.textContent='Building editable layers…';parent.postMessage({pluginMessage:{type:'build',payload}},'*')};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;status.textContent=m.message;if(m.type==='error')build.disabled=false};</script></body></html>
